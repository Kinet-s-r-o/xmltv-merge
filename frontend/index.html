<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XMLTV EPG</title>
    <script>
      // Apply the stored theme before first paint to avoid a dark/light flash.
      (function () {
        try {
          var preference = localStorage.getItem('xmltv-theme');
          var theme = preference === 'light' ? 'light'
            : preference === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light'
            : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
