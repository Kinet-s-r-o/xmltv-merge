services:
  db:
    build:
      context: ./backend
      dockerfile: postgres.Dockerfile
      pull: true
    container_name: xmltv_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xmltv}
      POSTGRES_USER: ${POSTGRES_USER:-xmltv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xmltv_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xmltv} -d ${POSTGRES_DB:-xmltv}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      pull: true
    container_name: xmltv_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xmltv}:${POSTGRES_PASSWORD:-xmltv_secret}@db:5432/${POSTGRES_DB:-xmltv}?sslmode=disable
      PORT: ${BACKEND_PORT:-8080}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      AUTH_SESSION_IDLE_MINUTES: ${AUTH_SESSION_IDLE_MINUTES:-480}
      AUTH_SESSION_MAX_HOURS: ${AUTH_SESSION_MAX_HOURS:-168}
      AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
    expose:
      - "${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      pull: true
    container_name: xmltv_frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
