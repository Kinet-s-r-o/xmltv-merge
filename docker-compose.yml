services:
  db:
    build:
      context: ./backend
      dockerfile: postgres.Dockerfile
      pull: true
    container_name: xmltv_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xmltv}
      POSTGRES_USER: ${POSTGRES_USER:-xmltv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xmltv_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xmltv} -d ${POSTGRES_DB:-xmltv}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      pull: true
    container_name: xmltv_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xmltv}:${POSTGRES_PASSWORD:-xmltv_secret}@db:5432/${POSTGRES_DB:-xmltv}?sslmode=disable
      PORT: ${BACKEND_PORT:-8080}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      AUTH_SESSION_IDLE_MINUTES: ${AUTH_SESSION_IDLE_MINUTES:-480}
      AUTH_SESSION_MAX_HOURS: ${AUTH_SESSION_MAX_HOURS:-168}
      AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      # DVB EIT multicast streaming (off by default, see network "catv").
      MULTICAST_ENABLED: ${MULTICAST_ENABLED:-false}
      # Outgoing interface by its macvlan address (robust against eth0/eth1
      # ordering inside the container).
      MULTICAST_INTERFACE: ${MULTICAST_INTERFACE:-${MULTICAST_IPV4:-172.31.254.10}}
      # Network settings of "catv", repeated here (unused by the backend) so
      # deployment tools that only scan service environments (Coolify) list
      # them as variables.
      MULTICAST_PARENT_IF: ${MULTICAST_PARENT_IF:-}
      MULTICAST_SUBNET: ${MULTICAST_SUBNET:-172.31.254.0/24}
      MULTICAST_GATEWAY: ${MULTICAST_GATEWAY:-172.31.254.1}
      MULTICAST_IPV4: ${MULTICAST_IPV4:-172.31.254.10}
    networks:
      default:
      catv:
        ipv4_address: ${MULTICAST_IPV4:-172.31.254.10}
    expose:
      - "${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      pull: true
    container_name: xmltv_frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:

networks:
  # Macvlan network for DVB EIT multicast towards the DVB-C modulator. The
  # bridge network never forwards multicast to the LAN. Set
  # MULTICAST_PARENT_IF to the host NIC (or VLAN sub-interface) in the
  # headend network; left empty, Docker backs it with an internal dummy
  # interface, so nothing leaves the host.
  catv:
    driver: macvlan
    driver_opts:
      parent: ${MULTICAST_PARENT_IF:-}
    ipam:
      config:
        - subnet: ${MULTICAST_SUBNET:-172.31.254.0/24}
          gateway: ${MULTICAST_GATEWAY:-172.31.254.1}
