services:
  db:
    image: postgres:17-alpine
    container_name: xmltv_db
    environment:
      POSTGRES_DB: xmltv
      POSTGRES_USER: xmltv
      POSTGRES_PASSWORD: xmltv_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmltv -d xmltv"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: xmltv_backend
    environment:
      DATABASE_URL: postgres://xmltv:xmltv_secret@db:5432/xmltv?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: xmltv_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
