services:
  db:
    image: postgres:17-alpine
    container_name: xmltv_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xmltv}
      POSTGRES_USER: ${POSTGRES_USER:-xmltv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xmltv_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xmltv} -d ${POSTGRES_DB:-xmltv}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: xmltv_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://xmltv:xmltv_secret@db:5432/xmltv?sslmode=disable}
      PORT: ${BACKEND_PORT:-8080}
    expose:
      - "${BACKEND_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: xmltv_frontend
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  pgdata:
