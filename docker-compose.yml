services:
  db:
    image: postgres:17-alpine
    container_name: xmltv_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xmltv}
      POSTGRES_USER: ${POSTGRES_USER:-xmltv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xmltv_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xmltv} -d ${POSTGRES_DB:-xmltv}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: xmltv_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xmltv}:${POSTGRES_PASSWORD:-xmltv_secret}@db:5432/${POSTGRES_DB:-xmltv}?sslmode=disable
      PORT: ${BACKEND_PORT:-8080}
    expose:
      - "${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: xmltv_frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
